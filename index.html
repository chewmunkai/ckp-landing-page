<!-- Meta Pixel. Lives here rather than in config.jsx on purpose: everything else
     on this page waits for React and Babel to download and compile (~3 MB), and
     a PageView that fires after that misses everyone who bounced first, which
     both undercounts traffic and starves the retargeting audience.
     The guard keeps the block inert if the ID is ever blanked — no requests,
     no errors — and every fbq() call elsewhere is written to no-op when the
     pixel did not load. -->
<script>
(function () {
  var PIXEL_ID = '342096625454617'; // CKP Ad Account's Pixel
  if (!/^\d+$/.test(PIXEL_ID)) return; // not configured yet
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
  n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
  document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', PIXEL_ID);
  fbq('track', 'PageView');
})();
</script>
<!-- The <noscript> half of Meta's canonical snippet. It repeats the ID because a
     static tag cannot read the variable above; change one and change both. With
     scripting on, the browser ignores this entirely, so it never double-counts
     the PageView already sent. Its reach here is small by design — the page is
     a React app, so a visitor without JavaScript sees an empty shell. -->
<noscript><img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id=342096625454617&ev=PageView&noscript=1" alt=""
/></noscript>
